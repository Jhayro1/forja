name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: sandbox (bubblewrap; el runner de CI es desechable, se permiten user namespaces)
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / true && echo "bwrap ok"
      - name: lint y formato (Biome)
        run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: instalación limpia del paquete (V2-043)
        run: npm run probar:paquete

  # Forja Ligera corre nativa en Windows (ligera/PLAN.md F1/F7): sus pruebas de punta a punta
  # con el agente simulado, y el instalador de un comando con el paquete recién armado.
  windows-ligera:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # El paquete raíz (Forja Completa) declara os: linux; la edición ligera no.
      - run: npm ci --force
      - run: npm run build
      - name: pruebas de la edición ligera en Windows nativo
        run: npx vitest run test/ligera test/run/block.test.ts test/doctor
      - name: paquete de Forja Ligera
        run: node scripts/empaquetar-ligera.mjs
      - name: instalador de un comando (PowerShell 5.1, como en un Windows recién instalado)
        shell: powershell
        run: |
          $env:FORJA_PAQUETE = "$PWD\build\ligera\forja-ligera.tgz"
          $env:FORJA_SIN_ABRIR = '1'
          Get-Content scripts\ligera.ps1 -Raw | Invoke-Expression
          & "$env:LOCALAPPDATA\Forja\forja.cmd" --version
          # Sin Claude ni Codex en el runner, doctor termina en «falta algo»: se revisa lo que dice.
          $salida = & "$env:LOCALAPPDATA\Forja\forja.cmd" doctor 2>&1 | Out-String
          Write-Host $salida
          if ($salida -notmatch 'Forja Ligera') { throw 'doctor no reconoce la edicion ligera' }
          $global:LASTEXITCODE = 0
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Forja.lnk")) { throw 'falta el acceso del menu Inicio' }

  # Bases de datos reales (docs/guias/BASES-DE-DATOS.md): el controlador, la transacción de sólo
  # lectura y las reglas (crear con aprobación, nunca tocar lo que ya existía) contra MySQL y PostgreSQL.
  bases-reales:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: solo-para-ci
          MYSQL_DATABASE: prueba
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psolo-para-ci"
          --health-interval=5s --health-timeout=5s --health-retries=30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: solo-para-ci
          POSTGRES_DB: prueba
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: pruebas contra MySQL y PostgreSQL
        run: npx vitest run test/db
        env:
          FORJA_BD_MYSQL: mysql://root:solo-para-ci@127.0.0.1:3306/prueba
          FORJA_BD_PG: postgres://postgres:solo-para-ci@127.0.0.1:5432/prueba

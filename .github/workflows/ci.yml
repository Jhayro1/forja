name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: sandbox (bubblewrap; el runner de CI es desechable, se permiten user namespaces)
        run: |
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / true && echo "bwrap ok"
      - name: lint y formato (Biome)
        run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: instalación limpia del paquete (V2-043)
        run: npm run probar:paquete

name: escritorio
# App de escritorio para Windows (Tauri) y la distro de WSL «Forja» que instala.
# En una etiqueta vX.Y.Z publica en el release: el instalador (.exe y .msi), la distro
# (forja-wsl-x64.tar.gz + .sha256) y forja.tgz (para actualizar sin reinstalar).
on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths: ['desktop/**', 'panel/**', '.github/workflows/escritorio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: construir la distro (Docker)
        run: desktop/distro/construir.sh salida
      - name: probar la distro como la usa la app (usuario forja, sin contraseña)
        run: |
          docker run --rm --privileged -u forja forja-wsl sh -c 'forja --version && claude --version && codex --version && bwrap --ro-bind / / true'
          docker run --rm -u forja forja-wsl sh -c 'test "$(id -u)" = 1000 && grep -q "default=forja" /etc/wsl.conf'
      - uses: actions/upload-artifact@v4
        with:
          name: distro
          path: salida/*
          retention-days: 7

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # El paquete raíz declara os: linux (Forja corre en Linux/WSL); aquí sólo hacen falta
      # las herramientas del panel y de Tauri, así que se instala igual y sin compilar la CLI.
      - run: npm ci --force --ignore-scripts
      - name: pruebas de la app (Rust)
        working-directory: desktop/src-tauri
        run: |
          npm run -s build:escritorio --prefix ../../panel
          cargo test
      - name: instalador (NSIS y MSI)
        run: npm run build -w desktop
      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [distro, app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artefactos/**/*.exe
            artefactos/**/*.msi
            artefactos/**/forja-wsl-x64.tar.gz
            artefactos/**/forja-wsl-x64.tar.gz.sha256
            artefactos/**/forja.tgz
          fail_on_unmatched_files: true

# Distro de Forja (la importa la app de escritorio).
[user]
default=forja

[boot]
systemd=false

[interop]
# Sin el PATH de Windows: un node o claude instalados en Windows no deben tapar a los de aquí.
appendWindowsPath=false

[automount]
# Las carpetas de C:\ aparecen como del usuario forja (uid 1000): git no las marca como
# «dubious ownership» al importar un proyecto de Windows.
options="uid=1000,gid=1000,umask=022,fmask=011,metadata"

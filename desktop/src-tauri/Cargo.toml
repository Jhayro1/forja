[package]
name = "forja-escritorio"
version = "0.1.0"
description = "App de escritorio de Forja: instala su distro de WSL y abre el panel en su propia ventana"
authors = ["Forja"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "forja_escritorio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
